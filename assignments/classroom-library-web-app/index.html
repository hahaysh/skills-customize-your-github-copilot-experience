<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Library</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header>
      <p class="eyebrow">Mergington High School</p>
      <h1>Classroom Library</h1>
    </header>

    <main>
      <section aria-labelledby="collection-heading">
        <h2 id="collection-heading">Book collection</h2>
        <p id="status" role="status" aria-live="polite">Loading books...</p>
        <ul id="book-list"></ul>
      </section>

      <section aria-labelledby="form-heading">
        <h2 id="form-heading">Add a book</h2>
        <form id="book-form">
          <!-- TODO: Add labeled number, title, and author inputs. -->
          <!-- Use the IDs "book-id", "book-title", and "book-author". -->

          <button type="submit">Add to library</button>
        </form>
      </section>
    </main>

    <script src="app.js"></script>
    <!-- Team contributions: Add each team member's name and contribution here. -->
  </body>
</html>
